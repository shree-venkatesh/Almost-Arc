#
# macOS installs on fresh runners (no Zen, so both also test get-zen.sh:
# downloading the official Zen and creating a profile):
#   pkg       "Almost Arc for Zen" .pkg (pkg/): build, install, check, install
#             again over it; attached to every Release / pre-release
#   terminal  ./install.sh, what Homebrew, curl and git clone all run
#   - pushes that touch the installer, and manual runs: build + test
#   - every Release / pre-release: build + test, then attach the .pkg to it
#   - weekly (Monday): build + test, to catch Zen changing its download
#     (file name, signing team) before a new user hits it

name: macOS installer

on:
  push:
    paths: [pkg/**, site/install.sh, install.sh, uninstall.sh, get-zen.sh, .github/workflows/pkg.yml]
  release:
    types: [published]
  schedule:
    - cron: "17 14 * * 1"   # Mondays 14:17 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach (empty: build the current commit, attach nothing)"
        required: false

permissions: {}

concurrency:
  group: pkg-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  pkg:
    runs-on: macos-latest
    permissions:
      contents: write   # attach the .pkg to the release
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}

      - name: Build
        run: |
          if [ -n "$TAG" ]; then VERSION="${TAG#v}"; else
            VERSION="$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' theme.json | head -1)"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git archive --format=tar --prefix="almost-arc-$VERSION/" HEAD | gzip -n -9 > "almost-arc-$VERSION.tar.gz"
          pkg/build.sh "$VERSION" "almost-arc-$VERSION.tar.gz" "Almost-Arc-for-Zen-$VERSION.pkg"

      - name: Install (fresh Mac, no Zen)
        run: |
          echo "console user: $(stat -f%Su /dev/console), me: $(whoami)"
          [ ! -d /Applications/Zen.app ] || echo "note: Zen already on the runner"
          sudo installer -pkg "Almost-Arc-for-Zen-$VERSION.pkg" -target / -verboseR || status=$?
          echo "---- installer log ----"; grep -E 'almost-arc|preinstall|postinstall' /var/log/install.log | tail -n 60 || true
          exit "${status:-0}"

      - name: Check
        run: |
          set -x
          R=/Applications/Zen.app/Contents/Resources
          test -f "$R/config.js"
          test -f "$R/defaults/pref/config-prefs.js"
          # Zen still starts with the loader in its app folder (the loader and icon
          # change the bundle, so its code signature no longer verifies; that's
          # expected and Zen runs regardless)
          rm -f /tmp/zen-shot.png
          /Applications/Zen.app/Contents/MacOS/zen --headless --screenshot /tmp/zen-shot.png about:blank &
          for _ in $(seq 1 60); do [ -s /tmp/zen-shot.png ] && break; sleep 1; done
          pkill -x zen || true; sleep 2
          test -s /tmp/zen-shot.png
          P="$HOME/Library/Application Support/zen"
          REL="$(awk -F= '/^\[Install/{f=1} f&&/^Default=/{print $2; exit}' "$P/profiles.ini")"
          C="$P/$REL/chrome"
          test -f "$C/almost-arc.css"
          grep -q almost-arc.css "$C/userChrome.css"
          for f in arcAutoPip arcNotices arcUrlbarFit arcTabUndo; do test -f "$C/JS/$f.uc.js"; done
          test -d "$C/utils"
          grep -q '>>> almost-arc' "$P/$REL/user.js"
          cat "$C/almost-arc-install.json"
          grep -q "\"version\": \"$VERSION\"" "$C/almost-arc-install.json"
          grep -q '"method": "cli"' "$C/almost-arc-install.json"
          test "$(stat -f%Su "$C/almost-arc.css")" = "$(whoami)"     # not owned by root
          test "$(stat -f%Su /Applications/Zen.app)" = "$(whoami)"   # Zen can update itself
          test -L /usr/local/bin/almost-arc
          almost-arc --version | grep -q "$VERSION"
          ls -la@ /Applications/Zen.app | head -5
          ! pgrep -x zen   # the profile-creating Zen run was stopped

      - name: Install again (update over an existing install)
        run: |
          sudo installer -pkg "Almost-Arc-for-Zen-$VERSION.pkg" -target /
          almost-arc --version | grep -q "$VERSION"

      - name: Uninstall puts Zen's own icon back
        run: |
          # icon state: the hidden Icon\r file and the kHasCustomIcon Finder flag
          icon_state() {
            local hex; hex="$(xattr -px com.apple.FinderInfo /Applications/Zen.app 2>/dev/null | tr -d ' \n')"
            local flag=0; [ "${#hex}" -ge 18 ] && [ $(( 0x${hex:16:2} & 0x04 )) -ne 0 ] && flag=1
            local file=0; [ -e /Applications/Zen.app/Icon$'\r' ] && file=1
            echo "file=$file flag=$flag"
          }
          echo "before: $(icon_state)"; test "$(icon_state)" = "file=1 flag=1"
          almost-arc uninstall
          echo "after: $(icon_state)"; test "$(icon_state)" = "file=0 flag=0"

      - uses: actions/upload-artifact@v4
        with:
          name: Almost-Arc-for-Zen-${{ env.VERSION }}
          path: Almost-Arc-for-Zen-*.pkg

      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "Almost-Arc-for-Zen-$VERSION.pkg" --clobber

  terminal:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}

      - name: ./install.sh on a fresh Mac (no Zen)
        run: |
          [ ! -d /Applications/Zen.app ] || echo "note: Zen already on the runner"
          ./install.sh

      - name: Check
        run: |
          set -x
          codesign -dv /Applications/Zen.app 2>&1 | grep -x 'TeamIdentifier=9V5K9TP787'
          test "$(stat -f%Su /Applications/Zen.app)" = "$(whoami)"
          test -f /Applications/Zen.app/Contents/Resources/config.js
          P="$HOME/Library/Application Support/zen"
          REL="$(awk -F= '/^\[Install/{f=1} f&&/^Default=/{print $2; exit}' "$P/profiles.ini")"
          test -f "$P/$REL/chrome/almost-arc.css"
          test -f "$P/$REL/chrome/JS/arcAutoPip.uc.js"
          ! pgrep -x zen

      - name: ./install.sh again (Zen already there)
        run: ./install.sh | tee out.txt && ! grep -q "downloading it" out.txt

      # Zen open: from a Terminal, install.sh asks to quit it, then opens it again.
      # `script` gives install.sh a terminal to ask in (CI steps have none).
      - name: Zen open, answer n - stops, Zen stays open
        timeout-minutes: 5
        run: |
          open -a Zen
          for _ in $(seq 1 60); do pgrep -x zen >/dev/null && break; sleep 1; done
          pgrep -x zen; sleep 10   # let it finish starting
          printf 'n\n' | script -q /dev/null ./install.sh | tee out.txt || true
          grep -q "Cancelled" out.txt
          pgrep -x zen

      - name: Zen open, no terminal to ask in - stops as before
        run: |
          if ./install.sh </dev/null >out.txt 2>&1; then cat out.txt; echo "should have stopped"; exit 1; fi
          cat out.txt; grep -q "Please quit Zen first" out.txt
          pgrep -x zen

      - name: Zen open, answer y - quits Zen, installs, opens Zen again
        timeout-minutes: 5
        run: |
          P="$HOME/Library/Application Support/zen"
          REL="$(awk -F= '/^\[Install/{f=1} f&&/^Default=/{print $2; exit}' "$P/profiles.ini")"
          rm "$P/$REL/chrome/JS/arcAutoPip.uc.js"   # to see that it installs again
          OLD="$(pgrep -x zen)"
          printf 'y\n' | script -q /dev/null ./install.sh | tee out.txt || true
          grep -q "Opening Zen again" out.txt
          test -f "$P/$REL/chrome/JS/arcAutoPip.uc.js"
          for _ in $(seq 1 60); do NEW="$(pgrep -x zen || true)"; [ -n "$NEW" ] && [ "$NEW" != "$OLD" ] && break; sleep 1; done
          echo "Zen before: $OLD, after: $NEW"; test -n "$NEW"; test "$NEW" != "$OLD"
          osascript -e 'tell application "Zen" to quit' || true
          for _ in $(seq 1 30); do pgrep -x zen >/dev/null || break; sleep 1; done

      - name: ./uninstall.sh puts Zen's own icon back
        run: |
          # icon state: the hidden Icon\r file and the kHasCustomIcon Finder flag
          icon_state() {
            local hex; hex="$(xattr -px com.apple.FinderInfo /Applications/Zen.app 2>/dev/null | tr -d ' \n')"
            local flag=0; [ "${#hex}" -ge 18 ] && [ $(( 0x${hex:16:2} & 0x04 )) -ne 0 ] && flag=1
            local file=0; [ -e /Applications/Zen.app/Icon$'\r' ] && file=1
            echo "file=$file flag=$flag"
          }
          echo "before: $(icon_state)"; test "$(icon_state)" = "file=1 flag=1"
          ./uninstall.sh
          echo "after: $(icon_state)"; test "$(icon_state)" = "file=0 flag=0"
