#
# Runs tests/ (node --test) on every push and pull request.

name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test 'tests/*.test.mjs'

  # The mod in a real Zen for Linux (latest release, under Xvfb with a window manager):
  # install.sh as a user would run it, then tests/zen/smoke.mjs through Marionette.
  zen-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Zen's own libraries (not all on the runner image) + a display and a window manager
      - run: sudo apt-get update && sudo apt-get install -y xvfb twm libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libxtst6 libx11-xcb1 libpci3 xfonts-base
      - run: tests/zen/run-linux.sh "$RUNNER_TEMP/zen" -- --shots "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zen-linux-screenshots
          path: ${{ runner.temp }}/shots
