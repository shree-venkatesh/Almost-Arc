#
# Points the Homebrew formula (shree-venkatesh/homebrew-tap,
# Formula/almost-arc.rb) at a newly published release.
# Runs when a full (non-prerelease) Release is published or a pre-release is
# promoted to a full Release ("released"); never for pre-releases or bare
# tags. Can also be run manually from the Actions tab with a tag name.
# Needs the secret HOMEBREW_TAP_TOKEN: a fine-grained token with
# Contents: read & write on shree-venkatesh/homebrew-tap only.

name: Update Homebrew formula

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to point the formula at (e.g. v1.0.2)"
        required: true

permissions: {}

concurrency: homebrew-tap

jobs:
  update-formula:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Compute release tarball checksum
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag '$TAG' is not vX.Y.Z"; exit 1; }
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          sha="$(curl -fsSL --retry 3 "$url" | sha256sum | cut -d' ' -f1)"
          echo "URL=$url" >> "$GITHUB_ENV"
          echo "SHA=$sha" >> "$GITHUB_ENV"
          echo "$url -> $sha"

      - uses: actions/checkout@v4
        with:
          repository: shree-venkatesh/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update formula and push
        run: |
          f=Formula/almost-arc.rb
          sed -i -E "s|^  url \".*\"$|  url \"$URL\"|; s|^  sha256 \".*\"$|  sha256 \"$SHA\"|" "$f"
          grep -q "$SHA" "$f" || { echo "::error::Could not update $f"; exit 1; }
          if git diff --quiet; then echo "Formula already points at $TAG"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "almost-arc ${TAG#v}"
          git push
